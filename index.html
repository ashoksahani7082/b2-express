<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#080606;color:#f8fafc}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 18px;overflow-x:hidden;background:radial-gradient(ellipse at 50% 35%,#210707 0%,#100606 48%,#050505 100%)}
.card{width:min(100%,660px);min-height:975px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 54px 56px;border:1px solid #25303d;border-radius:42px;background:#111111;box-shadow:0 25px 80px #0008}
.card:before{content:"";position:absolute;top:0;left:0;right:0;height:13px;background:linear-gradient(90deg,#9f1010,#ed1717,#7e0a0a)}
.logo-wrap{position:relative;width:246px;height:246px;margin:0 auto 43px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#390909 0%,#100909 63%,#080808 70%);border:7px solid #e50914;box-shadow:0 0 0 5px #3b1014,0 0 35px #ed101c55,inset 0 0 20px #e5091430}
.logo-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;border-radius:50%;background:radial-gradient(ellipse at 50% 25%,#321010,#070707 65%);overflow:hidden}
.logo-plane{position:absolute;top:18px;font-size:55px;color:#f31a22;transform:rotate(-13deg);text-shadow:0 0 18px #f00}
.logo-title{position:relative;margin-top:25px;font-weight:1000;font-style:italic;line-height:.86;letter-spacing:-5px;font-size:76px;color:#fff;text-shadow:3px 4px 0 #6f090d}
.logo-title span{color:#ed101a}
.logo-sub{font-weight:900;font-style:italic;font-size:24px;letter-spacing:-1px;transform:skew(-10deg);color:#f5f5f5}
.logo-lines{width:125px;height:17px;margin-top:10px;border-top:5px solid #e50914;border-bottom:4px solid #e50914;position:relative}
.logo-lines:after{content:"";position:absolute;left:12px;right:12px;top:4px;border-top:3px solid #f52932}
.live{display:inline-flex;align-items:center;gap:13px;padding:13px 28px;border:1px solid #b70b12;border-radius:99px;color:#ff101a;font-size:20px;font-weight:800;letter-spacing:.8px;background:#180b0b;box-shadow:0 0 25px #ed101a18;margin-bottom:32px}
.live-dot{width:14px;height:14px;border-radius:50%;background:#ed1010;box-shadow:0 0 13px #ed1010}
h1{font-size:50px;line-height:1.1;font-weight:900;letter-spacing:1px;margin:0 0 12px;color:#fff}
h1 span{color:#ed101a}
.members{font-size:24px;font-weight:800;color:#9ca3af;margin:0 0 47px}.members strong{color:#f8fafc}
.features{display:flex;align-items:center;justify-content:center;gap:40px;font-size:23px;color:#d1d5db;margin-bottom:51px;white-space:nowrap}
.features i{color:#ed101a;margin-right:10px;font-size:23px}
.timer{display:flex;align-items:center;justify-content:center;gap:14px;border:1px solid #25303d;border-radius:22px;background:#080808;padding:19px 26px;margin-bottom:28px;font-size:18px;font-weight:800;color:#9ca3af}
#timer{font-size:27px;letter-spacing:4px;color:#f10b16;font-variant-numeric:tabular-nums}
.join{width:min(100%,520px);margin-left:auto;margin-right:auto;align-self:center;min-height:108px;border-radius:100px;border:1px solid #ff4444;background:linear-gradient(100deg,#bd171c,#f00008);color:white;display:flex;align-items:center;justify-content:center;gap:22px;font-size:30px;font-weight:900;letter-spacing:2px;box-shadow:0 0 38px #f00a2438,inset 0 1px #ff7373;cursor:pointer;transition:transform .2s,filter .2s}
.join:hover{transform:translateY(-2px);filter:brightness(1.1)}.join:disabled{opacity:.7;cursor:wait}.join i{font-size:42px}
.tagline{font-size:16px;letter-spacing:3px;font-weight:900;color:#4b5563;margin-top:31px}
#status{min-height:18px;font-size:12px;color:#cbd5e1;margin-top:12px}
@media(max-width:600px){body{padding:18px 12px}.card{min-height:0;padding:54px 22px 38px;border-radius:30px}.logo-wrap{width:190px;height:190px;margin-bottom:34px}.logo-title{font-size:59px}.logo-sub{font-size:20px}.logo-plane{font-size:42px;top:14px}h1{font-size:36px}.members{font-size:18px;margin-bottom:36px}.live{font-size:16px;padding:11px 22px;margin-bottom:25px}.features{font-size:15px;gap:20px;margin-bottom:38px}.features i{font-size:17px;margin-right:5px}.timer{gap:10px;padding:16px 18px;font-size:13px;border-radius:17px}#timer{font-size:23px;letter-spacing:3px}.join{min-height:82px;font-size:20px;gap:14px;letter-spacing:1px}.join i{font-size:30px}.tagline{font-size:12px;letter-spacing:2px;margin-top:26px}}

<body>
<main class="card">
  <div class="logo-wrap" aria-label="B2 Express logo">
    <div class="logo-inner">
      <i class="fa-solid fa-plane logo-plane" aria-hidden="true"></i>
      <div class="logo-title">B2<span>EX</span></div>
      <div class="logo-sub">EXPRESS</div>
      <div class="logo-lines"></div>
      <div style="font-size:7px;font-weight:900;letter-spacing:2px;color:#9ca3af;margin-top:7px">FAST. BOLD. FEARLESS.</div>
    </div>
  </div>
  <div class="live"><span class="live-dot"></span> LIVE NOW</div>
  <h1>B2 <span>EXPRESS</span></h1>
  <p class="members"><strong>70,301+</strong> active members</p>
  <div class="features">
    <span><i class="fa-solid fa-check" aria-hidden="true"></i>100% Free</span>
    <span><i class="fa-solid fa-bolt" aria-hidden="true"></i>Instant Access</span>
  </div>
  <div class="timer"><span>OFFER ENDS IN:</span><span id="timer">09:00</span></div>
  <button id="joinBtn" class="join"><i class="fa-brands fa-telegram" aria-hidden="true"></i><span id="buttonText">JOIN TELEGRAM</span></button>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="tagline">FLY HIGH. CASH BIG.</div>
</main>
<script>
const timer=document.getElementById('timer');let seconds=9*60;
function tick(){timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds>0)seconds--}
tick();setInterval(tick,1000);
const btn=document.getElementById('joinBtn'),buttonText=document.getElementById('buttonText'),statusEl=document.getElementById('status');
btn.addEventListener('click',async()=>{
  btn.disabled=true;buttonText.textContent='PREPARING…';statusEl.textContent='Creating your secure Telegram invite link…';
  try{
    const params=new URLSearchParams(location.search);let referrerHost=null;try{if(document.referrer)referrerHost=new URL(document.referrer).hostname}catch{}
    const fbp=document.cookie.match(/(?:^|; )_fbp=([^;]+)/)?.[1]||null;
    let fbc=document.cookie.match(/(?:^|; )_fbc=([^;]+)/)?.[1]||null;const fbclid=params.get('fbclid');if(!fbc&&fbclid)fbc='fb.1.'+Date.now()+'.'+fbclid;
    const response=await fetch('/api/create-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:params.get('utm_source')||(fbclid?'facebook':null),campaign:params.get('utm_campaign'),medium:params.get('utm_medium'),content:params.get('utm_content'),term:params.get('utm_term'),fbclid,landing_referrer:referrerHost,landing_url:location.href,fbp,fbc,user_agent:navigator.userAgent})});
    const data=await response.json();if(!response.ok||!data.ok||!data.invite_link)throw new Error(data.error||'Could not create invite');
    location.href=data.invite_link;
  }catch(e){console.error('Invite creation failed:',e);statusEl.textContent='Could not create invite. Check your connection and try again.';buttonText.textContent='TRY AGAIN';btn.disabled=false}
});
</script>
