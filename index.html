<style>
:root{--red:#e50914;--red-light:#ff3945;--red-dark:#8e1218;--panel:#111010;--text:#f8fafc}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050505;color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;padding:28px 16px;overflow-x:hidden;background:radial-gradient(ellipse at 50% 20%,#271010 0%,#100909 48%,#050505 100%)}
.bg-orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.35;z-index:0;pointer-events:none;animation:float 12s infinite ease-in-out alternate}
.orb-1{width:360px;height:360px;background:#e50914;top:-140px;left:-130px}
.orb-2{width:420px;height:420px;background:#8b1e2d;bottom:-190px;right:-140px;animation-delay:-6s}
@keyframes float{0%{transform:translate(0,0) scale(1)}100%{transform:translate(45px,55px) scale(1.12)}}
.glass-card{width:min(100%,420px);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 28px 30px;border:1px solid rgba(229,9,20,.25);border-radius:32px;background:linear-gradient(145deg,rgba(35,19,20,.92),rgba(10,10,10,.96));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 65px #000b,0 0 35px #e5091410,inset 0 1px #ffffff0a;z-index:2}
.glass-card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,#e50914,#ff626a,#e50914,transparent)}
.logo-stage{position:relative;width:142px;height:142px;margin:4px auto 25px;display:grid;place-items:center}
.rotating-ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0%,transparent 28%,#8b1e2d 48%,#ff3945 72%,#8b1e2d 90%,transparent 100%);animation:rotate 3s linear infinite}
.rotating-ring:after{content:"";position:absolute;inset:3px;background:#100909;border-radius:50%}
@keyframes rotate{to{transform:rotate(360deg)}}
.logo-inner{position:relative;z-index:1;width:132px;height:132px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,#321010,#070707 70%);border:2px solid #351013;box-shadow:0 0 28px #e5091425}
.logo-image{display:block;width:100%;height:100%;object-fit:contain;padding:4px;border-radius:50%}
.live{display:inline-flex;align-items:center;gap:9px;padding:9px 17px;margin-bottom:17px;border:1px solid #572126;border-radius:99px;color:#ff6a72;font-size:11px;font-weight:800;letter-spacing:1.8px;background:#1a0c0d}
.live-dot{width:8px;height:8px;border-radius:50%;background:#ed3038;box-shadow:0 0 10px #ed3038;animation:blink 1.5s infinite}
@keyframes blink{50%{opacity:.45}}
h1{font-size:32px;line-height:1.15;font-weight:900;letter-spacing:.7px;margin:0 0 9px;color:#fff;text-shadow:0 2px 20px #e5091425}
h1 span{color:#ff3945}
.members{font-size:14px;font-weight:600;color:#b8aeae;margin:0 0 23px}
.members strong{color:#fff;font-weight:800}
.features{display:flex;align-items:center;justify-content:center;gap:18px;width:100%;margin-bottom:24px;padding:13px 10px;border:1px solid #ffffff12;border-radius:14px;background:#ffffff08;box-shadow:inset 0 1px #ffffff06;font-size:12px;font-weight:700;color:#e8dddd}
.features i{color:#ff3945;margin-right:6px}
.feature-divider{width:1px;height:20px;background:#ffffff20}
.timer{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border:1px solid #682126;border-radius:17px;background:linear-gradient(135deg,#190a0b,#090707);padding:15px;margin-bottom:20px;box-shadow:inset 0 0 22px #e5091409;position:relative;overflow:hidden}
.timer:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,#e509140c,transparent);pointer-events:none}
.timer-label{font-size:10px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:#b7a8a8;position:relative}
#timer{font-size:29px;line-height:1.2;font-weight:900;letter-spacing:4px;color:#ff3945;text-shadow:0 0 14px #e509143c;font-variant-numeric:tabular-nums;position:relative}
@keyframes pulse-shadow{0%{box-shadow:0 0 0 0 #e5091460}70%{box-shadow:0 0 0 15px #e5091400}100%{box-shadow:0 0 0 0 #e5091400}}
.join{width:100%;min-height:68px;border-radius:16px;border:1px solid #ff626a;background:linear-gradient(110deg,#a91119,#e51c27 55%,#b50f18);color:white;display:flex;align-items:center;justify-content:center;gap:13px;font-size:17px;font-weight:900;letter-spacing:1.2px;box-shadow:0 12px 28px #f00a2425,inset 0 1px #ff9a9e;cursor:pointer;transition:transform .2s,filter .2s;animation:pulse-shadow 2.5s infinite}
.join:hover{transform:translateY(-2px);filter:brightness(1.08)}
.join:disabled{opacity:.72;cursor:wait;animation:none}
.join i{font-size:25px}
.secure-note{font-size:10px;color:#938585;margin:19px 0 0;text-transform:uppercase;letter-spacing:1.8px;font-weight:700;opacity:.8}
#status{width:100%;min-height:16px;font-size:12px;color:#ffb6ba;margin:10px 0 0;text-align:center}
@media(max-width:480px){body{padding:16px 12px}.glass-card{padding:30px 21px 26px;border-radius:27px}.logo-stage{width:126px;height:126px;margin-bottom:22px}.logo-inner{width:116px;height:116px}h1{font-size:29px}.members{font-size:13px;margin-bottom:20px}.features{gap:12px;font-size:11px;padding:12px 7px}.timer{margin-bottom:17px;padding:14px}.join{min-height:64px;font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg-orb orb-1" aria-hidden="true"></div>
<div class="bg-orb orb-2" aria-hidden="true"></div>
<main class="glass-card">
  <div class="logo-stage" aria-label="B2 Express logo">
    <div class="rotating-ring" aria-hidden="true"></div>
    <div class="logo-inner"><img class="logo-image" src="./b2%20logo.jpg" alt="B2 Express logo"></div>
  </div>
  <div class="live"><span class="live-dot"></span> LIVE NOW</div>
  <h1>B2 <span>EXPRESS</span></h1>
  <p class="members"><strong>70,301+</strong> active members</p>
  <div class="features">
    <span><i class="fa-solid fa-shield-halved" aria-hidden="true"></i>100% Free</span>
    <span class="feature-divider" aria-hidden="true"></span>
    <span><i class="fa-solid fa-bolt" aria-hidden="true"></i>Instant Access</span>
  </div>
  <div class="timer"><span class="timer-label">Offer Ends In</span><span id="timer">09:00</span></div>
  <button id="joinBtn" class="join"><i class="fa-brands fa-telegram" aria-hidden="true"></i><span id="buttonText">JOIN CHANNEL</span></button>
  <p id="status" role="status" aria-live="polite"></p>
  <p class="secure-note"><i class="fa-solid fa-lock" aria-hidden="true"></i> &nbsp;Secure &amp; Verified</p>
</main>
<script>
const timer=document.getElementById('timer');let seconds=9*60;
function tick(){timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds>0)seconds--}
tick();setInterval(tick,1000);
const btn=document.getElementById('joinBtn'),buttonText=document.getElementById('buttonText'),statusEl=document.getElementById('status');
btn.addEventListener('click',async()=>{
  btn.disabled=true;buttonText.textContent='PREPARING…';statusEl.textContent='Creating your secure Telegram invite link…';
  try{
    const params=new URLSearchParams(location.search);let referrerHost=null;try{if(document.referrer)referrerHost=new URL(document.referrer).hostname}catch{}
    const fbp=document.cookie.match(/(?:^|; )_fbp=([^;]+)/)?.[1]||null;
    let fbc=document.cookie.match(/(?:^|; )_fbc=([^;]+)/)?.[1]||null;const fbclid=params.get('fbclid');if(!fbc&&fbclid)fbc='fb.1.'+Date.now()+'.'+fbclid;
    const response=await fetch('/api/create-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pixel_id:window.B2_SELECTED_PIXEL_ID||'837475619388782',source:params.get('utm_source')||(fbclid?'facebook':null),campaign:params.get('utm_campaign'),medium:params.get('utm_medium'),content:params.get('utm_content'),term:params.get('utm_term'),fbclid,landing_referrer:referrerHost,landing_url:location.href,fbp,fbc,user_agent:navigator.userAgent})});
    const data=await response.json();if(!response.ok||!data.ok||!data.invite_link)throw new Error(data.error||'Could not create invite');
    location.href=data.invite_link;
  }catch(e){console.error('Invite creation failed:',e);statusEl.textContent='Could not create invite. Check your connection and try again.';buttonText.textContent='TRY AGAIN';btn.disabled=false}
});
</script>
</body>
