<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 EXPRESS - Join Telegram</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        pageBg: '#050505',
                        cardBg: '#111111',
                        brandRed: '#e50000',     /* Deep Red matching the logo */
                        brandRedGlow: '#ff1a1a', /* Brighter red for glows */
                        textMuted: '#9ca3af'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: white;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, rgba(229, 0, 0, 0.1) 0%, rgba(5, 5, 5, 1) 60%);
        }

        .logo-image {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid #e50000;
            object-fit: cover;
            background: #000;
            box-shadow: 0 0 30px rgba(229, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .logo-image:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(229, 0, 0, 0.7);
        }

        #telegramJoinBtn:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>

    <!-- ========================= -->
    <!-- META PIXEL (UNTOUCHED) -->
    <!-- ========================= -->
    <script>
        !function(f,b,e,v,n,t,s)
        {
            if(f.fbq)return;
            n=f.fbq=function(){
                n.callMethod ?
                n.callMethod.apply(n,arguments) :
                n.queue.push(arguments)
            };
            if(!f._fbq)f._fbq=n;
            n.push=n;
            n.loaded=!0;
            n.version='2.0';
            n.queue=[];
            t=b.createElement(e);
            t.async=!0;
            t.src=v;
            s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)
        }(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        
        fbq('init', '924764623699511');
        fbq('track', 'PageView');
    </script>
    <noscript>
        <img height="1" width="1" style="display:none"
             src="https://www.facebook.com/tr?id=924764623699511&ev=PageView&noscript=1" />
    </noscript>
</head>

<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 font-sans relative">

    <!-- ========================= -->
    <!-- MAIN CARD CONTENT -->
    <!-- ========================= -->
    <div class="relative w-full max-w-sm bg-cardBg rounded-3xl overflow-hidden shadow-[0_15px_50px_rgba(0,0,0,0.8)] border border-gray-800 flex flex-col items-center pb-8 z-10">
        
        <!-- Top Red Gradient Accent -->
        <div class="h-2 w-full bg-gradient-to-r from-red-900 via-brandRed to-red-900 mb-8"></div>

        <!-- ========================================== -->
        <!-- 🖼️ UPDATE YOUR LOGO HERE 🖼️ -->
        <!-- Yahan par aapki photo ka naam daala gaya hai -->
        <!-- ========================================== -->
        <div class="mb-5 relative rounded-full p-1 bg-gradient-to-b from-gray-800 to-black inline-block">
            <img 
                src="b2 logo.jpg" 
                alt="B2 EXPRESS Logo" 
                class="logo-image"
                onerror="this.src='https://placehold.co/140x140/000000/e50000?text=B2'"
            >
        </div>
        <!-- ========================================== -->

        <!-- LIVE Badge (Red Theme) -->
        <div class="bg-red-950/50 border border-brandRed/40 text-brandRed text-xs font-bold px-4 py-1.5 rounded-full flex items-center gap-2 mb-4 tracking-wider uppercase shadow-[0_0_10px_rgba(229,0,0,0.2)]">
            <div class="w-2 h-2 bg-brandRed rounded-full animate-pulse shadow-[0_0_5px_#e50000]"></div>
            LIVE NOW
        </div>

        <!-- HEADING -->
        <h1 class="text-3xl font-black text-center text-white tracking-widest mb-1 uppercase">
            B2 <span class="text-brandRed">EXPRESS</span>
        </h1>

        <!-- SUBSCRIBERS -->
        <p class="text-gray-400 text-sm font-semibold mb-6 tracking-wide">
            <span class="text-white font-bold">70,301+</span> active members
        </p>

        <!-- FEATURES / BULLET POINTS -->
        <div class="flex items-center gap-6 text-sm font-medium text-gray-300 mb-7">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-check text-brandRed"></i>
                100% Free
            </div>
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bolt text-brandRed"></i>
                Instant Access
            </div>
        </div>

        <!-- COUNTDOWN -->
        <div class="bg-black/50 border border-gray-800 px-5 py-2 rounded-xl text-gray-400 text-xs font-semibold mb-4 flex items-center gap-2">
            <span>OFFER ENDS IN:</span>
            <span class="text-brandRed text-base font-bold tracking-widest" id="countdown">14:59</span>
        </div>

        <!-- TELEGRAM BUTTON -->
        <button 
            id="telegramJoinBtn" 
            type="button" 
            class="w-10/12 bg-gradient-to-r from-red-700 to-brandRed text-white font-extrabold py-4 px-6 rounded-full text-lg hover:scale-105 transition-all duration-300 shadow-[0_0_20px_rgba(229,0,0,0.4)] hover:shadow-[0_0_30px_rgba(229,0,0,0.6)] uppercase tracking-widest flex justify-center items-center gap-3 border border-red-500/50"
        >
            <i class="fa-solid fa-plane-departure text-xl"></i>
            JOIN TELEGRAM
        </button>

        <p class="text-gray-600 text-[10px] mt-4 uppercase tracking-widest font-semibold">
            Fly High. Cash Big.
        </p>
    </div>

    <!-- ========================= -->
    <!-- COUNTDOWN SCRIPT (UNTOUCHED) -->
    <!-- ========================= -->
    <script>
        let timeInSeconds = 15 * 60;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const minutes = Math.floor(timeInSeconds / 60);
            let seconds = timeInSeconds % 60;

            seconds = seconds < 10 ? '0' + seconds : seconds;
            let displayMinutes = minutes < 10 ? '0' + minutes : minutes;

            if (countdownEl) {
                countdownEl.innerHTML = `${displayMinutes}:${seconds}`;
            }
            if (timeInSeconds > 0) {
                timeInSeconds--;
            } else {
                timeInSeconds = 0;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

    <!-- ========================= -->
    <!-- TELEGRAM & META SCRIPT (UNTOUCHED LOGIC) -->
    <!-- ========================= -->
    <script>
        function getCookie(name) {
            const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? decodeURIComponent(match[2]) : null;
        }

        function getFBCLID() {
            const params = new URLSearchParams(window.location.search);
            return params.get('fbclid');
        }

        function getFBC() {
            const existingFbc = getCookie('_fbc');
            if (existingFbc) return existingFbc;

            const fbclid = getFBCLID();
            if (!fbclid) return null;

            return ('fb.1.' + Date.now() + '.' + fbclid);
        }

        const telegramButton = document.getElementById('telegramJoinBtn');

        if (telegramButton) {
            telegramButton.addEventListener('click', async function () {
                const button = this;

                // Disable button
                button.disabled = true;
                
                // Show connecting spinner
                button.innerHTML = `
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    CONNECTING...
                `;

                try {
                    const fbclid = getFBCLID();
                    const fbp = getCookie('_fbp');
                    const fbc = getFBC();

                    console.log('Meta tracking data:', { fbclid: fbclid, fbc: fbc, fbp: fbp });

                    const response = await fetch('/api/telegram-link', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fbclid: fbclid,
                            fbc: fbc,
                            fbp: fbp
                        })
                    });

                    const result = await response.json();
                    console.log('Telegram API response:', result);

                    if (!response.ok || !result.ok || !result.inviteLink) {
                        throw new Error(result.error || 'Telegram link creation failed');
                    }

                    if (typeof fbq === 'function') {
                        fbq('trackCustom', 'TelegramClick');
                    }

                    window.location.href = result.inviteLink;

                } catch (error) {
                    console.error('Telegram tracking error:', error);

                    // Restore button with correct new design
                    button.disabled = false;
                    button.innerHTML = `
                        <i class="fa-solid fa-plane-departure text-xl"></i>
                        JOIN TELEGRAM
                    `;

                    alert('Please try again.');
                }
            });
        }
    </script>
</body>
</html>
