<style>

.card{width:min(100%,660px);min-height:0;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:54px 48px 42px;border:1px solid #382a2a;border-radius:32px;background:linear-gradient(160deg,#171313 0%,#0d0b0b 70%);box-shadow:0 24px 70px #0009,0 0 0 1px #ffffff05,inset 0 1px #ffffff0a}

.logo-wrap{position:relative;width:220px;height:220px;margin:0 auto 30px;display:grid;place-items:center;border-radius:50%;background:#0b0808;border:4px solid #e50914;box-shadow:0 0 0 4px #3b1014,0 0 30px #ed101c35,inset 0 0 16px #e5091420;overflow:hidden}

<body>
<main class="card">
  <div class="logo-wrap" aria-label="B2 Express logo">
    <img class="logo-image" src="./b2%20logo.jpg" alt="B2 Express original logo">
  </div>
  <div class="live"><span class="live-dot"></span> LIVE NOW</div>
  <h1>B2 <span>EXPRESS</span></h1>
  <p class="members"><strong>70,301+</strong> active members</p>

    <span><i class="fa-solid fa-check" aria-hidden="true"></i>100% Free</span>
    <span><i class="fa-solid fa-bolt" aria-hidden="true"></i>Instant Access</span>
  </div>
  <div class="timer"><span>OFFER ENDS IN:</span><span id="timer">09:00</span></div>
  <button id="joinBtn" class="join"><i class="fa-brands fa-telegram" aria-hidden="true"></i><span id="buttonText">JOIN TELEGRAM</span></button>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="tagline">FLY HIGH. CASH BIG.</div>
</main>
<script>
const timer=document.getElementById('timer');let seconds=9*60;
function tick(){timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(seconds>0)seconds--}
tick();setInterval(tick,1000);
const btn=document.getElementById('joinBtn'),buttonText=document.getElementById('buttonText'),statusEl=document.getElementById('status');
btn.addEventListener('click',async()=>{
  btn.disabled=true;buttonText.textContent='PREPARING…';statusEl.textContent='Creating your secure Telegram invite link…';
  try{
    const params=new URLSearchParams(location.search);let referrerHost=null;try{if(document.referrer)referrerHost=new URL(document.referrer).hostname}catch{}
    const fbp=document.cookie.match(/(?:^|; )_fbp=([^;]+)/)?.[1]||null;
    let fbc=document.cookie.match(/(?:^|; )_fbc=([^;]+)/)?.[1]||null;const fbclid=params.get('fbclid');if(!fbc&&fbclid)fbc='fb.1.'+Date.now()+'.'+fbclid;
    const response=await fetch('/api/create-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pixel_id:window.B2_SELECTED_PIXEL_ID||'837475619388782',source:params.get('utm_source')||(fbclid?'facebook':null),campaign:params.get('utm_campaign'),medium:params.get('utm_medium'),content:params.get('utm_content'),term:params.get('utm_term'),fbclid,landing_referrer:referrerHost,landing_url:location.href,fbp,fbc,user_agent:navigator.userAgent})});
    const data=await response.json();if(!response.ok||!data.ok||!data.invite_link)throw new Error(data.error||'Could not create invite');
    location.href=data.invite_link;
  }catch(e){console.error('Invite creation failed:',e);statusEl.textContent='Could not create invite. Check your connection and try again.';buttonText.textContent='TRY AGAIN';btn.disabled=false}
});
</script>
