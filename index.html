<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 EXPRESS - Official Telegram Channel</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Configuration for Animations & Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0088cc', // Official Telegram Blue
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for Premium Glassmorphism Effect -->
    <style>
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        
        .animation-delay-2000 {
            animation-delay: 2s;
        }
    </style>

    <!-- ========================================== -->
    <!-- 🔥 PASTE YOUR TRACKING PIXEL CODE HERE 🔥  -->
    <!-- (e.g., Facebook Pixel, Google Analytics, etc.) -->
    
    <!--

    </script>

    <!-- ========================================== -->
</head>
<body class="min-h-screen flex flex-col text-gray-800 antialiased selection:bg-brand selection:text-white relative overflow-hidden">

    <!-- Decorative Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000 z-0"></div>

    <!-- Navigation / Header -->
    <nav class="w-full py-5 px-6 md:px-12 flex justify-between items-center relative z-10">
        <div class="text-2xl font-extrabold tracking-tighter text-gray-900">
            B2 <span class="text-brand">EXPRESS</span>
        </div>
    </nav>

    <!-- Main Hero Section -->
    <main class="flex-grow flex items-center justify-center px-4 pt-10 pb-20 relative z-10">
        
        <!-- Glassmorphism Container -->
        <div class="glass-card w-full max-w-3xl rounded-3xl p-8 md:p-14 text-center relative opacity-0 animate-fade-in-up">
            
            <!-- Telegram Icon -->
            <div class="w-20 h-20 bg-gradient-to-tr from-brand to-blue-400 rounded-full mx-auto flex items-center justify-center mb-8 shadow-lg shadow-brand/40 hover:scale-105 transition-transform duration-300 cursor-pointer">
                <svg class="w-10 h-10 text-white translate-x-[-2px] translate-y-[2px]" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.892-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
            </div>

            <!-- Headline -->
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-gray-900 tracking-tight mb-5">
                Welcome to <br class="md:hidden" />
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">B2 EXPRESS</span>
            </h1>
            
            <!-- Subtitle -->
            <p class="text-lg md:text-xl text-gray-600 mb-10 max-w-2xl mx-auto font-medium leading-relaxed">
                Fastest updates, premium insights, aur exclusive content direct aapke Telegram par. Hamari community join karein aur hamesha aage rahein.
            </p>

            <!-- Call to Action Button -->
            <!-- Note: Replace '#' in href with your actual Telegram Channel Link -->
            <a href="#" target="_blank" class="inline-flex items-center justify-center gap-3 px-10 py-4 text-lg font-semibold text-white bg-brand rounded-full hover:bg-blue-600 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 w-full sm:w-auto">
                <span>Join Channel Now</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </a>

            <!-- Social Proof / Trust Badge -->
            <div class="mt-8 flex items-center justify-center gap-2 text-sm text-gray-500 font-medium">
                <span class="flex h-3 w-3 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                Join thousands of active members today
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-gray-500 text-sm font-medium relative z-10">
        <p>&copy; 2026 B2 EXPRESS. All rights reserved.</p>
    </footer>

    <!-- ========================================== -->

    <!-- (Some pixels like Meta/Facebook require an iframe fallback here) -->
    <!-- ========================================== -->
    
</body>
</html>
