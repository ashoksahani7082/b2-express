    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Clean white background */
            color: #333333;
        }

        /* Enhanced glow and float animation for the logo */
        @keyframes glowPulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
                transform: translateY(0) scale(1);
            }
            50% {
                box-shadow: 0 0 60px rgba(250, 204, 21, 0.9), 0 0 20px rgba(250, 204, 21, 0.5) inset;
                transform: translateY(-8px) scale(1.04);
            }
        }

        .logo-container {
            animation: glowPulse 3s infinite ease-in-out;
        }

        /* Smooth continuous pulse for the button */
        @keyframes buttonPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 10px 25px rgba(250, 204, 21, 0.6);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            }
        }

        .btn-pulse {
            animation: buttonPulse 2.5s infinite ease-in-out;
            transition: all 0.3s ease;
        }
        
        .btn-pulse:hover {
            animation: none; /* Stop pulsing on hover */
            transform: scale(1.05);
            box-shadow: 0 12px 30px rgba(250, 204, 21, 0.7);
        }
    </style>
