<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 Express | Official Telegram Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated Background Orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s infinite alternate ease-in-out;
            z-index: -1;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: #2563eb;
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 400px;
            height: 400px;
            background: #0ea5e9;
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Premium Glass Card */
        .premium-glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Rotating Border around Logo */
        .spin-border {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 340deg, #3b82f6 360deg);
            animation: spin 3s linear infinite;
        }
        
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Gradient Text */
        .text-gradient {
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Shimmer Effect for Button */
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }

        /* Attention Pulse for Button */
        @keyframes pulse-glow {
            0%, 100% { 
                box-shadow: 0 0 20px 0px rgba(42,171,238, 0.4); 
                transform: scale(1); 
            }
            50% { 
                box-shadow: 0 0 35px 8px rgba(42,171,238, 0.8); 
                transform: scale(1.03); 
            }
        }
        .btn-attention {
            animation: pulse-glow 2.5s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-6 relative">

    <!-- Background Elements -->
    <div class="fixed inset-0 w-full h-full pointer-events-none overflow-hidden">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <!-- Grid overlay -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4wNSkiLz48L3N2Zz4=')] opacity-50 z-[-1]"></div>
    </div>

    <!-- Main Content Container -->
    <div class="premium-glass w-full max-w-[420px] rounded-[32px] p-8 md:p-10 flex flex-col items-center relative z-10">
        
        <!-- Avatar Section -->
        <div class="relative mb-6">
            <div class="spin-border"></div>
            <div class="absolute inset-0 rounded-full bg-blue-500/20 blur-xl"></div>
            <div class="relative w-28 h-28 rounded-full border-[3px] border-[#1a1a1a] bg-[#111] overflow-hidden flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.3)]">
                <!-- Placeholder for Logo -->
                <span class="text-3xl font-extrabold text-white tracking-tighter text-gradient">B2</span>
            </div>
            <!-- Verified Badge -->
            <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full p-1 border-2 border-[#111] shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>

        <!-- Title & Subtitle -->
        <div class="text-center mb-7">
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">B2 EXPRESS</h1>
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 border border-white/10">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                <span class="text-xs font-semibold text-gray-300 uppercase tracking-widest">Live Signals</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-3 w-full mb-6">
            <div class="bg-white/[0.03] border border-white/5 p-4 rounded-2xl text-center hover:bg-white/[0.05] transition-colors">
                <p class="text-2xl font-bold text-white mb-0.5">20.7K</p>
                <p class="text-[11px] text-gray-400 font-medium uppercase tracking-wide">Subscribers</p>
            </div>
            <div class="bg-white/[0.03] border border-white/5 p-4 rounded-2xl text-center hover:bg-white/[0.05] transition-colors">
                <p class="text-2xl font-bold text-blue-400 mb-0.5">98%</p>
                <p class="text-[11px] text-gray-400 font-medium uppercase tracking-wide">Accuracy</p>
            </div>
        </div>

        <!-- Feature List -->
        <div class="w-full space-y-3 mb-8">
            <div class="flex items-center gap-3 text-sm text-gray-200">
                <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <span class="font-medium">India's No.1 Aviator Analyst</span>
            </div>
            <div class="flex items-center gap-3 text-sm text-gray-200">
                <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </div>
                <span class="font-medium">15,000+ Active Members</span>
            </div>
            <div class="flex items-center gap-3 text-sm text-gray-200">
                <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <span class="font-medium">Daily Real-Time Predictions</span>
            </div>
        </div>

        <!-- CTA Button -->
        <div class="w-full relative mt-4 mb-2 flex justify-center">
            <button id="joinBtn" 
                    class="btn-attention relative overflow-hidden w-auto min-w-[300px] max-w-full bg-[#2AABEE] hover:bg-[#2298d6] text-white font-bold text-[14px] sm:text-[15px] py-4 px-8 rounded-full transition-all duration-300 active:translate-y-0 group flex items-center justify-center gap-2 shadow-[0_10px_30px_rgba(42,171,238,0.5)]">
                
                <!-- Telegram Icon SVG -->
                <svg id="btnIcon" class="w-5 h-5 flex-shrink-0 relative z-20 transition-transform group-hover:scale-110 group-hover:-rotate-12" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>

                <span id="btnText" class="relative z-20 tracking-wide whitespace-nowrap">JOIN FREE TELEGRAM CHANNEL</span>
                
                <!-- Shimmer Animation -->
                <div class="absolute top-0 -inset-full h-full w-1/2 z-10 block transform -skew-x-12 bg-gradient-to-r from-transparent to-white opacity-20 group-hover:animate-[shimmer_1.5s_infinite]"></div>
            </button>
        </div>

    </div>

    <script>
        const btn = document.getElementById('joinBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        let isClicked = false;

        btn.addEventListener('click', (e) => {
            e.preventDefault(); // Prevent immediate navigation if wrapped in <a>
            
            if (isClicked) return; 
            
            isClicked = true;
            
            // Visual feedback
            btn.classList.remove('btn-attention'); // Stop the continuous pulse
            btnText.innerText = 'JOINING...';
            btnIcon.style.display = 'none'; // Hide icon while joining
            
            // Disable button styles
            btn.classList.remove('hover:-translate-y-1', 'hover:shadow-[0_10px_40px_-10px_rgba(42,171,238,0.6)]');
            btn.classList.add('opacity-75', 'cursor-wait');
            
            // Simulate network request or redirect
            setTimeout(() => {
                // Replace this URL with your actual Telegram link
                window.location.href = 'https://t.me/your_channel_link';
            }, 800);
        });
    </script>
</body>
</html>
